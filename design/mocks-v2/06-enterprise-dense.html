<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
Direction 06, Enterprise dense. Ether v2 UI mock.
Layout: top bar, a 208px project rail with icons and labels, breadcrumb bar and a page title row with actions; data as compact tables with sortable headers.
Palette: blue-gray neutrals with one confident blue accent; green, red and violet only for state and diff meaning.
Type: Source Sans 3 at 14px on a 12/14/16/20 scale, Source Code Pro for code, shas, paths and branch names.
-->
<title>Ether, direction 06: Enterprise dense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light dark;
  --canvas:#eef1f5;--surface:#ffffff;--surface-2:#f5f7fa;--surface-3:#e3e8ef;--surface-hover:#eef3f9;
  --border:#d5dce6;--border-strong:#aab4c3;
  --text:#172033;--text-2:#414d60;--text-3:#5b6779;
  --accent:#0b5cad;--accent-btn:#0b5cad;--accent-btn-hover:#094d91;--accent-soft:#e4eefa;--accent-text:#0b4f94;
  --open:#1a7f37;--open-text:#176b30;--open-soft:#dcf1e2;
  --merged:#6e40c9;--merged-text:#5b30a8;--merged-soft:#f0eafc;
  --closed:#b42318;--closed-text:#a11d14;--closed-soft:#fbe7e5;
  --add-text:#176b30;--add-soft:#e3f4e8;--del-text:#a11d14;--del-soft:#fbe9e7;
  --focus:#0b5cad;
  --board:#dfe4eb;--board-text:#26324a;
  --shadow:0 1px 2px rgb(23 32 51/.08),0 4px 12px rgb(23 32 51/.08);
  --font-ui:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Source Code Pro",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#0f1420;--surface:#161c2b;--surface-2:#1d2536;--surface-3:#263047;--surface-hover:#202a40;
    --border:#2e3850;--border-strong:#4a5570;
    --text:#e6ebf3;--text-2:#b7c0cf;--text-3:#9aa6ba;
    --accent:#6fb4ff;--accent-btn:#1f6fc4;--accent-btn-hover:#2a7ad2;--accent-soft:#15294a;--accent-text:#8dc2ff;
    --open:#3fb950;--open-text:#7ee09a;--open-soft:#14301f;
    --merged:#a878f0;--merged-text:#c6a7ff;--merged-soft:#2a2046;
    --closed:#ff7b72;--closed-text:#ff9b93;--closed-soft:#3b1a1e;
    --add-text:#7ee09a;--add-soft:#14301f;--del-text:#ff9b93;--del-soft:#3b1a1e;
    --focus:#6fb4ff;
    --board:#080b12;--board-text:#d5dce8;
    --shadow:0 1px 2px rgb(0 0 0/.5),0 4px 12px rgb(0 0 0/.4);
  }
}
:root[data-theme="dark"]{
  --canvas:#0f1420;--surface:#161c2b;--surface-2:#1d2536;--surface-3:#263047;--surface-hover:#202a40;
  --border:#2e3850;--border-strong:#4a5570;
  --text:#e6ebf3;--text-2:#b7c0cf;--text-3:#9aa6ba;
  --accent:#6fb4ff;--accent-btn:#1f6fc4;--accent-btn-hover:#2a7ad2;--accent-soft:#15294a;--accent-text:#8dc2ff;
  --open:#3fb950;--open-text:#7ee09a;--open-soft:#14301f;
  --merged:#a878f0;--merged-text:#c6a7ff;--merged-soft:#2a2046;
  --closed:#ff7b72;--closed-text:#ff9b93;--closed-soft:#3b1a1e;
  --add-text:#7ee09a;--add-soft:#14301f;--del-text:#ff9b93;--del-soft:#3b1a1e;
  --focus:#6fb4ff;
  --board:#080b12;--board-text:#d5dce8;
  --shadow:0 1px 2px rgb(0 0 0/.5),0 4px 12px rgb(0 0 0/.4);
}
body{margin:0;background:var(--board);color:var(--board-text);font:400 14px/20px var(--font-ui);min-width:320px;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:13px}
.muted{color:var(--text-3)}

.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.i-20{width:20px;height:20px}

.board{max-width:1280px;margin:0 auto;padding:28px 24px 72px;display:grid;gap:52px}
.board-head h1{font:700 20px/28px var(--font-ui);margin:4px 0 0;color:var(--board-text)}
.board-head p{margin:8px 0 0;max-width:75ch;opacity:.9}
.board-kicker{font:600 12px/16px var(--font-ui);margin:0;opacity:.8}
.board-nav{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:13px}
.board-nav a{text-decoration:underline;text-underline-offset:3px}
.shot{margin:0;min-width:0}
.label{display:flex;align-items:center;gap:8px;font:600 13px/16px var(--font-ui);padding:0 0 8px;margin:0;color:var(--board-text)}
.label .no{font-family:var(--font-mono);opacity:.75;font-weight:500}
.frame{width:100%;max-width:1280px;overflow:clip;border:1px solid var(--border-strong);border-radius:8px;background:var(--canvas);color:var(--text);box-shadow:var(--shadow);position:relative}
.states{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:32px 24px;align-items:start}
.states .wide{grid-column:1/-1}
.state-body{padding:20px;background:var(--canvas);min-height:200px}

/* controls */
.btn{height:32px;padding:0 12px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);color:var(--text);font:600 14px/1 var(--font-ui);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background-color 150ms,border-color 150ms,color 150ms}
.btn:hover{background:var(--surface-hover)}
.btn:active{background:var(--surface-3)}
.btn[aria-expanded="true"]:not(.btn-primary){background:var(--surface-3)}
.btn-primary{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff}
.btn-primary:hover{background:var(--accent-btn-hover);border-color:var(--accent-btn-hover)}
.btn:disabled{background:var(--surface-2);border-color:var(--border);color:var(--text-3);cursor:not-allowed}
.btn-primary:disabled{background:var(--surface-3);border-color:var(--surface-3);color:var(--text-3)}
.btn-sm{height:28px;padding:0 10px;font-size:13px}
.icon-btn{width:32px;height:32px;padding:0;border:0;border-radius:4px;background:transparent;color:var(--text-2);display:inline-grid;place-items:center;cursor:pointer;transition:background-color 150ms,color 150ms}
.icon-btn:hover{background:var(--surface-hover);color:var(--text)}
.icon-btn:active{background:var(--surface-3)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{height:30px;padding:0 10px;border:0;border-right:1px solid var(--border-strong);background:transparent;color:var(--text-2);font:600 14px/1 var(--font-ui);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background-color 150ms,color 150ms}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-hover);color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.field{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);color:var(--text-3);min-width:0}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);outline:none;height:100%}
.field input::placeholder{color:var(--text-3)}
.field:focus-within,.field.force-focus{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.force-focus:not(.field){outline:2px solid var(--focus);outline-offset:2px}
.link{color:var(--accent-text);text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;font:600 13px/1 var(--font-ui);white-space:nowrap;border:1px solid transparent}
.badge .i{width:14px;height:14px}
.badge.open{background:var(--open-soft);color:var(--open-text);border-color:color-mix(in srgb,var(--open) 40%,transparent)}
.badge.merged{background:var(--merged-soft);color:var(--merged-text);border-color:color-mix(in srgb,var(--merged) 40%,transparent)}
.badge.closed{background:var(--closed-soft);color:var(--closed-text);border-color:color-mix(in srgb,var(--closed) 40%,transparent)}
.badge.private{background:transparent;color:var(--text-2);border-color:var(--border-strong)}
.st-open{color:var(--open)}
.st-closed{color:var(--closed)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;border-radius:3px;background:var(--surface-3);color:var(--text-2);font:600 12px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.avatar{width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--text-2);font:600 12px/20px var(--font-ui);text-align:center;flex:none;text-transform:uppercase}
.avatar.md{width:28px;height:28px;font-size:14px;line-height:28px}

/* top bar, rail, breadcrumb */
.top{height:48px;display:flex;align-items:center;gap:16px;padding:0 12px 0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{display:inline-flex;align-items:center;gap:8px;font:700 16px/1 var(--font-ui);color:var(--text)}
.logo svg{color:var(--accent)}
.top-nav{display:flex;gap:2px;height:48px}
.top-nav a{display:inline-flex;align-items:center;padding:0 10px;color:var(--text-2);font-weight:600;border-bottom:2px solid transparent;transition:color 150ms,border-color 150ms}
.top-nav a:hover{color:var(--text)}
.top-nav a[aria-current="page"]{color:var(--text);border-color:var(--accent)}
.top-end{margin-left:auto;display:flex;align-items:center;gap:8px}
.gsearch{width:240px;height:32px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface-2);color:var(--text-3)}
.gsearch input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);outline:none}
.gsearch input::placeholder{color:var(--text-3)}
.gsearch:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.gsearch kbd{font:600 12px/1 var(--font-ui);padding:2px 5px;border:1px solid var(--border-strong);border-radius:3px;background:var(--surface);color:var(--text-2)}
.search-btn,.menu-btn{display:none}

.shell{display:grid;grid-template-columns:208px minmax(0,1fr);background:var(--canvas);min-width:0}
.rail{background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rail-proj{display:flex;align-items:center;gap:8px;padding:6px 8px 12px;border-bottom:1px solid var(--border);margin-bottom:8px;min-width:0}
.rail-proj .box{width:28px;height:28px;border-radius:4px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font:700 14px/1 var(--font-ui);flex:none}
.rail-proj strong{font:600 14px/18px var(--font-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.rail-proj span{font-size:12px;color:var(--text-3);display:block}
.rail a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:4px;color:var(--text-2);font-weight:600;transition:background-color 150ms,color 150ms;position:relative}
.rail a:hover{background:var(--surface-hover);color:var(--text)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.rail a[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.rail .count{margin-left:auto}
.rail-label{font:600 12px/16px var(--font-ui);color:var(--text-3);padding:12px 10px 4px}

.main{min-width:0;display:flex;flex-direction:column}
.crumb-bar{height:40px;display:flex;align-items:center;gap:6px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);font-size:14px;color:var(--text-2);min-width:0}
.crumb-bar a{color:var(--text-2)}
.crumb-bar a:hover{color:var(--accent-text);text-decoration:underline}
.crumb-bar .sep{color:var(--text-3)}
.crumb-bar strong{color:var(--text);font-weight:600}
.crumb-bar .badge{margin-left:4px}
.title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px 12px;background:var(--canvas)}
.title-row h2{margin:0;font:700 20px/28px var(--font-ui);display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.title-row h2 .num{font-weight:400;color:var(--text-3)}
.title-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.repo-tabs{display:flex;gap:0;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.repo-tabs a,.dtabs a{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;color:var(--text-2);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;transition:color 150ms,border-color 150ms}
.repo-tabs a:hover,.dtabs a:hover{color:var(--text)}
.repo-tabs a[aria-current="page"],.dtabs a[aria-current="true"]{color:var(--text);border-color:var(--accent)}
.content{padding:0 20px 28px;min-width:0}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;min-width:0}
.anchor{position:relative}
.pop{position:absolute;top:calc(100% + 4px);left:0;z-index:10;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;box-shadow:var(--shadow);padding:8px}
.pop-group{font:600 12px/16px var(--font-ui);color:var(--text-3);padding:8px 8px 4px;text-transform:uppercase;letter-spacing:.04em}
.pop-item{width:100%;display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 8px;border:0;border-radius:4px;background:transparent;text-align:left;cursor:pointer;color:var(--text);transition:background-color 150ms}
.pop-item:hover{background:var(--surface-hover)}
.pop-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text)}
.pop-item .i{color:var(--text-2)}
.pop-item .hint{margin-left:auto;font-size:12px;color:var(--text-3)}
.pop-item .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.pop-filter{margin-bottom:6px}
.clone-pop{width:360px;right:0;left:auto}
.clone-pop p{margin:4px 4px 8px;font:600 14px/20px var(--font-ui)}
.clone-row{display:flex;gap:8px}
.clone-row input{flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface-2);color:var(--text);font:400 13px/1 var(--font-mono);text-overflow:ellipsis}
.clone-row input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.clone-pop label{display:block;font:600 12px/16px var(--font-ui);color:var(--text-2);margin:8px 0 4px}
.hint-text{font-size:13px;line-height:18px;color:var(--text-2);margin:8px 0 4px}

.dtable-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;background:var(--surface);scrollbar-width:thin}
table{border-collapse:collapse;width:100%}
.dtable{font-size:14px}
.dtable th{text-align:left;font:600 12px/16px var(--font-ui);color:var(--text-2);background:var(--surface-2);padding:0;height:32px;border-bottom:1px solid var(--border);white-space:nowrap}
.dtable th button{display:inline-flex;align-items:center;gap:4px;width:100%;height:32px;padding:0 10px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;transition:color 150ms,background-color 150ms}
.dtable th button:hover{color:var(--text);background:var(--surface-hover)}
.dtable th button .i{width:14px;height:14px;opacity:.5}
.dtable th[aria-sort] button .i{opacity:1;color:var(--accent-text)}
.dtable th .plain{display:block;padding:0 10px;line-height:32px}
.dtable td{height:36px;padding:0 10px;border-bottom:1px solid var(--border);color:var(--text-2);white-space:nowrap;vertical-align:middle}
.dtable tr:last-child td{border-bottom:0}
.dtable tbody tr{transition:background-color 150ms}
.dtable tbody tr:hover{background:var(--surface-hover)}
.dtable tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.dtable .r{text-align:right}
.dtable .c{text-align:center}
.dtable .w{width:100%}
.dtable .title-cell{white-space:normal;min-width:200px}
.dtable .title-cell a{color:var(--text);font-weight:600}
.dtable .title-cell a:hover{color:var(--accent-text);text-decoration:underline}
.dtable .meta{font-size:12px;color:var(--text-3);margin-top:2px}
.dtable .ico{display:inline-flex;align-items:center;gap:8px;color:var(--text);font-weight:600}
.dtable .ico:hover{color:var(--accent-text);text-decoration:underline}
.dtable .ico .i{color:var(--text-2)}
.dtable .add{color:var(--add-text);font-variant-numeric:tabular-nums}
.dtable .del{color:var(--del-text);font-variant-numeric:tabular-nums}
.dtable .sha{font-family:var(--font-mono);font-size:13px;color:var(--accent-text)}
.dtable .mono{font-size:13px;color:var(--text)}
.dtable .cnt{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.dtable .cnt .i{width:14px;height:14px}
.dtable tfoot td{background:var(--surface-2);font-size:13px;color:var(--text-3)}
.table-foot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--border);background:var(--surface-2);font-size:13px;color:var(--text-2);flex-wrap:wrap}
.table-foot .pager{margin-left:auto;display:flex;gap:6px;align-items:center}
.table-foot .btn{height:28px;font-size:13px;padding:0 10px}

.commit-bar{display:flex;align-items:center;gap:8px;min-height:38px;padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);border-bottom:0;border-radius:6px 6px 0 0;min-width:0;flex-wrap:wrap;font-size:14px}
.commit-msg{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.commit-msg:hover{color:var(--accent-text);text-decoration:underline}
.sha{font-family:var(--font-mono);font-size:13px;color:var(--accent-text)}
.sha:hover{text-decoration:underline}
.when{color:var(--text-3);white-space:nowrap;font-size:13px}
.commit-count{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}
.commit-count:hover{color:var(--accent-text)}
.files-table .name-cell a{display:inline-flex;align-items:center;gap:8px;color:var(--text);font-weight:600}
.files-table .name-cell a:hover{color:var(--accent-text);text-decoration:underline}
.files-table .name-cell .i{color:var(--text-2)}
.fsize{display:none;font-size:12px;color:var(--text-3);margin-left:8px;font-variant-numeric:tabular-nums}

.readme{margin-top:16px;border:1px solid var(--border);border-radius:6px;background:var(--surface);overflow:hidden}
.readme-head{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface-2);font:600 14px/1 var(--font-ui);color:var(--text-2)}
.prose{padding:20px 24px 24px;max-width:75ch;font-size:15px;line-height:22px;color:var(--text)}
.prose h1{font:700 20px/28px var(--font-ui);margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.prose p{margin:0 0 12px;color:var(--text-2)}
.prose ul{margin:0;padding-left:20px;color:var(--text-2)}
.prose li{margin:0 0 4px}
.prose pre{margin:0 0 14px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;overflow-x:auto;font:400 13px/20px var(--font-mono);color:var(--text)}

/* PR layout */
.pr-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side-card{border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:12px}
.side-card h3{margin:0 0 8px;font:600 12px/16px var(--font-ui);color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.side-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px}
.side-card dt{color:var(--text-3)}
.side-card dd{margin:0;color:var(--text);min-width:0;overflow-wrap:anywhere}
.side-card .mono{font-size:12px}
.dtabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:thin}
.dtabs .count{margin-left:2px}

.dtabs .del{color:var(--del-text);font-size:12px;font-variant-numeric:tabular-nums}
.timeline{display:flex;flex-direction:column;gap:12px;min-width:0}
.comment{border:1px solid var(--border);border-radius:6px;background:var(--surface);min-width:0}
.comment-head{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);border-radius:6px 6px 0 0;font-size:13px;color:var(--text-2);flex-wrap:wrap}
.comment-head strong{color:var(--text);font-weight:600}
.comment-head .when{margin-left:auto}
.comment-body{padding:10px 14px;color:var(--text);font-size:15px;line-height:22px;max-width:75ch}
.comment-body p{margin:0}
.event{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;padding-left:4px;flex-wrap:wrap}
.event .i{color:var(--text-3)}
.event strong{color:var(--text);font-weight:600}
.section-h{display:flex;align-items:center;gap:8px;margin:24px 0 8px;font:700 16px/24px var(--font-ui);flex-wrap:wrap}
.section-h .add{color:var(--add-text);font:600 13px/1 var(--font-ui)}
.section-h .del{color:var(--del-text);font:600 13px/1 var(--font-ui)}
.diff{border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface);margin-top:12px}
.diff-head{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);flex-wrap:wrap;min-width:0}
.diff-head .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--text)}
.diff-head .add{color:var(--add-text);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.diff-head .del{color:var(--del-text);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.diff-scroll{overflow-x:auto;scrollbar-width:thin}
.dl{display:grid;grid-template-columns:40px 40px 18px minmax(max-content,1fr);min-width:max-content;font:400 13px/20px var(--font-mono);color:var(--text)}
.dl .ln{text-align:right;padding:0 6px;color:var(--text-3);background:var(--surface-2);user-select:none;font-variant-numeric:tabular-nums}
.dl .sg{text-align:center;color:var(--text-2);user-select:none}
.dl .cd{padding:0 12px 0 4px;white-space:pre}
.dl.add{background:var(--add-soft)}
.dl.add .sg{color:var(--add-text)}
.dl.del{background:var(--del-soft)}
.dl.del .sg{color:var(--del-text)}
.dl.hunk{background:var(--accent-soft);color:var(--accent-text)}
.dl.hunk .ln{background:transparent}
.tk{color:var(--accent-text);font-weight:600}
.merge{border:1px solid var(--border);border-radius:6px;background:var(--surface);overflow:hidden;margin:20px 0 0}
.merge-status{display:flex;gap:10px;padding:12px 14px;align-items:flex-start;border-bottom:1px solid var(--border)}
.merge-status .i{margin-top:2px}
.merge-status .ok{color:var(--open)}
.merge-status .bad{color:var(--closed)}
.merge-status h3{margin:0;font:600 15px/20px var(--font-ui)}
.merge-status p{margin:2px 0 0;color:var(--text-2);font-size:13px}
.merge-actions{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);flex-wrap:wrap;font-size:13px;color:var(--text-3)}
.merge-actions .btn{margin-left:auto}
.composer{margin-top:20px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:12px 14px;display:grid;gap:8px}
.composer label{font:600 13px/16px var(--font-ui);color:var(--text-2)}
.composer textarea{width:100%;min-height:88px;padding:8px 10px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);color:var(--text);resize:vertical;font:400 15px/22px var(--font-ui)}
.composer textarea::placeholder{color:var(--text-3)}
.composer textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.composer .foot{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.conflict-list{margin:8px 0 0;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface-2);list-style:none;font-size:13px}
.conflict-list li{display:flex;align-items:center;gap:8px;padding:2px 0}
.conflict-list .i{color:var(--closed)}
.skel{background:var(--surface-3);border-radius:3px;height:12px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.skel-row{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-bottom:1px solid var(--border)}
.empty{padding:36px 20px;text-align:center;color:var(--text-2)}
.empty h3{margin:10px 0 4px;font:700 16px/24px var(--font-ui);color:var(--text)}
.empty p{margin:0 0 12px}
.empty .i{color:var(--text-3)}

              <header class="readme-head"><svg class="i"><use href="#i-book"/></svg>README.md</header>
              <div class="prose">
                <h1 id="readme-title">ether-core</h1>
                <p>Ether is a self-hosted, invite-only code host for a small group of trusted people. It runs inside your tailnet, serves git over HTTPS and keeps issues and pull requests in the same repository.</p>
                <pre><code>bun install
bun run build
bun run ether create-admin &lt;you&gt; --password '...'
bun run start</code></pre>
                <ul>
