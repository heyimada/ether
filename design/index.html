<title>Ether Design Directions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: a fixed-width index of the ten directions beside a live preview frame; stacks on phones. */
  :root {
    --bg: #f4f4f1;
    --panel: #ffffff;
    --ink: #17171a;
    --ink-2: #55555c;
    --ink-3: #8a8a91;
    --line: #e2e2dc;
    --accent: #3a3fd1;
    --accent-soft: #e8e9fb;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111114; --panel: #18181c; --ink: #ececef; --ink-2: #b0b0b8; --ink-3: #7c7c85;
      --line: #2a2a31; --accent: #9da1ff; --accent-soft: #23244a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111114; --panel: #18181c; --ink: #ececef; --ink-2: #b0b0b8; --ink-3: #7c7c85;
    --line: #2a2a31; --accent: #9da1ff; --accent-soft: #23244a; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    display: flex; flex-direction: column; gap: 20px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; max-width: 1600px; width: 100%; margin: 0 auto; }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  header.top p { margin: 0; color: var(--ink-2); max-width: 70ch; }

  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; max-width: 1600px; width: 100%; margin: 0 auto; }

  nav.list { display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow-y: auto; padding-right: 4px; }
  .item {
    display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 10px; align-items: baseline;
    padding: 12px 14px; border-radius: 10px; border: 1px solid transparent; background: transparent;
    text-align: left; color: inherit; font: inherit; cursor: pointer; width: 100%;
  }
  .item:hover { background: var(--panel); border-color: var(--line); }
  .item[aria-current="true"] { background: var(--panel); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .item .n { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .item[aria-current="true"] .n { color: var(--accent); }
  .item .name { font-weight: 600; }
  .item .what { grid-column: 2; color: var(--ink-2); font-size: 13.5px; }

  .viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .bar .title { font-weight: 600; min-width: 0; }
  .bar .file { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }
  .bar .spacer { flex: 1; }
  .bar a { color: var(--accent); font-weight: 500; text-decoration: none; }
  .bar a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .bar .nav { display: inline-flex; gap: 6px; }
  .bar button { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  .bar button:hover { border-color: var(--ink-3); }
  iframe { flex: 1; width: 100%; min-height: 0; border: 0; background: var(--bg); }

  @media (max-width: 900px) {
    html, body { height: auto; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav.list { overflow: visible; padding-right: 0; }
    iframe { flex: none; height: 78vh; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .item { transition: background-color 120ms ease, border-color 120ms ease; }
  }
</style>

<header class="top">
  <h1>Ether design directions</h1>
  <p>Round 2: ten directions for a professional, GitHub-class tool, each showing the same screens (repository code view, pull request, issues list) plus its interface states. Pick one to preview. Each follows your light or dark setting.</p>
</header>

<div class="layout">
  <nav class="list" id="list" aria-label="Design directions"></nav>
  <section class="viewer" aria-label="Preview">
    <div class="bar">
      <span class="title" id="v-title"></span>
      <span class="file" id="v-file"></span>
      <span class="spacer"></span>
      <span class="nav">
        <button type="button" id="prev" aria-label="Previous direction">Previous</button>
        <button type="button" id="next" aria-label="Next direction">Next</button>
      </span>
      <a id="v-open" href="#" target="_blank" rel="noopener">Open full page</a>
    </div>
    <iframe id="frame" title="Design preview" loading="eager"></iframe>
  </section>
</div>

<script>
  const DIRECTIONS = [
    { id: "classic-hub", file: "01-classic-hub.html", name: "Classic hub", what: "GitHub's own layout: global header, repo header, underline tabs and a right sidebar. Cool neutrals, one blue, Inter." },
    { id: "sidebar-workspace", file: "02-sidebar-workspace.html", name: "Sidebar workspace", what: "Linear-style app shell with Inbox, pull requests, issues and pinned repos in a left sidebar. Dark-first graphite, indigo, Geist." },
    { id: "monochrome", file: "03-monochrome.html", name: "Monochrome precision", what: "Near-white and near-black with 1px hairlines. Hierarchy from weight and spacing, colour only for state. Geist." },
    { id: "split-code", file: "04-split-code.html", name: "Split code view", what: "A persistent file tree beside the content, IDE-style, that becomes a drawer on phones. Slate and teal, IBM Plex." },
    { id: "review-inbox", file: "05-review-inbox.html", name: "Review inbox", what: "Pull requests and issues as a list beside a detail pane, like a mail client. Warm grey with indigo, Inter." },
    { id: "enterprise-dense", file: "06-enterprise-dense.html", name: "Enterprise dense", what: "Project rail, breadcrumb bar and compact tables with sortable headers. Blue-grey with one blue, Source Sans 3." },
    { id: "command-first", file: "07-command-first.html", name: "Command-first", what: "Single-row chrome, no sidebar. You navigate through a Ctrl K palette and every primary action shows its key. Emerald, Inter." },
    { id: "calm-reading", file: "08-calm-reading.html", name: "Calm reading", what: "A 68-character reading column with a Details column instead of a dense sidebar, so the content leads. Deep blue, Public Sans." },
    { id: "activity-overview", file: "09-activity-overview.html", name: "Activity overview", what: "The repo home opens with what is happening: open PRs, commits by person, open issues and a 12-week sparkline. Git green, Manrope." },
    { id: "native-desktop", file: "10-native-desktop.html", name: "Native desktop", what: "Unified toolbar, segmented tabs, a source-list sidebar and an inspector on pull requests. System grey and blue, Inter." },
    { id: "hub-activity", file: "11-hub-activity.html", name: "Hub and activity", what: "The chosen mix: Classic hub's layout with Activity overview's strip, sparkline and contributors. Teal accent kept apart from the open-state green, Manrope." },
  ];

  const list = document.getElementById("list");
  const frame = document.getElementById("frame");
  const title = document.getElementById("v-title");
  const file = document.getElementById("v-file");
  const open = document.getElementById("v-open");
  let current = 0;

  DIRECTIONS.forEach((d, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "item";
    b.id = "item-" + d.id;
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span><span class="name"></span><span class="what"></span>`;
    b.querySelector(".name").textContent = d.name;
    b.querySelector(".what").textContent = d.what;
    b.addEventListener("click", () => show(i, true));
    list.appendChild(b);
  });

  function show(i, push) {
    current = (i + DIRECTIONS.length) % DIRECTIONS.length;
    const d = DIRECTIONS[current];
    const src = "mocks-v2/" + d.file;
    if (frame.getAttribute("src") !== src) frame.setAttribute("src", src);
    title.textContent = `${String(current + 1).padStart(2, "0")} · ${d.name}`;
    file.textContent = d.file;
    open.href = src;
    list.querySelectorAll(".item").forEach((el, n) => el.setAttribute("aria-current", n === current ? "true" : "false"));
    if (push) {
      try { history.replaceState(null, "", "#" + d.id); } catch (e) {}
      try { localStorage.setItem("ether-direction-v2", d.id); } catch (e) {}
    }
  }

  document.getElementById("prev").addEventListener("click", () => show(current - 1, true));
  document.getElementById("next").addEventListener("click", () => show(current + 1, true));
  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); show(current + 1, true); list.children[current].focus(); }
    if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); show(current - 1, true); list.children[current].focus(); }
  });

  const fromHash = DIRECTIONS.findIndex((d) => "#" + d.id === location.hash);
  let saved = -1;
  try { saved = DIRECTIONS.findIndex((d) => d.id === localStorage.getItem("ether-direction-v2")); } catch (e) {}
  show(fromHash >= 0 ? fromHash : saved >= 0 ? saved : 0, false);
</script>
