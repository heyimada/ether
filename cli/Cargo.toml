[package]
name = "ether-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line client for Ether: repositories, issues and pull requests from your terminal"
license = "MIT"

[[bin]]
name = "ether"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dirs = "7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
