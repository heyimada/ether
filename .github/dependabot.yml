version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps arrive as one pull request; majors stay separate for review.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
