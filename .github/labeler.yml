      - any-glob-to-any-file: ["src/server/**", "drizzle/**", "drizzle.config.ts"]
web:
  - changed-files:
      - any-glob-to-any-file: ["src/web/**", "vite.config.ts"]
cli:
  - changed-files:
      - any-glob-to-any-file: "cli/**"
e2e:
  - changed-files:
      - any-glob-to-any-file: ["e2e/**", "playwright.config.ts"]
ci:
