name: Label pull requests

# pull_request_target so pull requests from forks can be labelled too. This workflow
# never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
