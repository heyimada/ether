name: Fix

# A "/fix" comment on a pull request asks an agent to fix the open review findings, through the shared engine in
# heyimada/review. issue_comment always runs this file from main. Only works when both the commenter and the pull
# request's author have write access and the branch is in this repository.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  fix:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/fix') }}
    uses: heyimada/review/.github/workflows/fix.yml@3ad7182dc644e6a59efa8e1042a42b61f48624de # main
    permissions:
      contents: read
      pull-requests: read
      id-token: write
