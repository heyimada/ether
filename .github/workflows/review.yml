name: Review

# Bug and security review by the shared engine in heyimada/review, posted by the review GitHub App, with the settings in
# .github/review.json. pull_request_target, so the engine, the settings and the secrets come from trusted refs and a pull
# request can't change its own reviewer. The engine never installs, builds or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: heyimada/review/.github/workflows/review.yml@3ad7182dc644e6a59efa8e1042a42b61f48624de # main
    permissions:
      contents: read
      pull-requests: read
      # Tells the engine which of its commits this is.
      id-token: write
