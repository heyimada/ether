name: Merge gate

# Posts the "Review gate" check run (as the review App) with its decision for the pull request's head commit, through
# the shared engine in heyimada/review. When the change qualifies, the App approves that commit and enables auto-merge;
# otherwise a person has to approve. Never checks out the pull request's code. Re-runs when the pull request changes,
# and through workflow_run when a review, CI or a human review finishes.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [Review, Review trigger, CI]
    types: [completed]

permissions: {}

concurrency:
  # Keyed on the head commit for both events. A running gate finishes instead of being cancelled, which showed up as a
  # failed check; the gate is idempotent. GitHub still cancels a waiting run when a newer one queues, so a burst of
  # events can leave a cancelled run, but no longer one cut off halfway.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    uses: heyimada/review/.github/workflows/gate.yml@3ad7182dc644e6a59efa8e1042a42b61f48624de # main
    permissions:
      contents: read
      pull-requests: read
      checks: read
      id-token: write
