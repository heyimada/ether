name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.0

jobs:
  web:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The build regenerates the committed route tree; fail if it was stale.
      - run: git diff --exit-code src/web/routeTree.gen.ts
      - run: bun run typecheck
      - run: bun run test

  cli:
    name: CLI (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Sets kache as RUSTC_WRAPPER and keeps its store in the GitHub Actions cache. Only main saves, so pull requests
      # restore main's cache without filling the 10 GB quota with one entry per branch.
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # e2e/cli.spec.ts builds the Rust client.
      - uses: dtolnay/rust-toolchain@stable
      # Sets kache as RUSTC_WRAPPER and keeps its store in the GitHub Actions cache. Only main saves, so pull requests
      # restore main's cache without filling the 10 GB quota with one entry per branch.
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: e2e-report/
          retention-days: 14

  review-config:
    name: Review config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: heyimada/review/actions/check@0fbfe9190b3cd91a1ba8ba5f609f9b786a1a928c # main
