name: Claude code review

# Reviews pull requests with Claude Code, authenticated with a Claude subscription
# OAuth token (`claude setup-token`) stored as the CLAUDE_CODE_OAUTH_TOKEN secret.
#
# Runs on `pull_request`, so pull requests from forks get no secrets and are
# skipped. Never switch this to `pull_request_target`: Claude reads the pull
# request's code, and that event would hand it the repository's secrets.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Pinned because this step holds the OAuth token; Dependabot bumps it.
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CONTRIBUTING.md first for the project
            layout and conventions. Ether is a self-hosted git server: a Bun +
            Elysia server (src/server/), a TanStack Start web app (src/web/), a
            Rust CLI (cli/), and Playwright e2e tests (e2e/).

            Focus on, in order:
            1. Correctness bugs: logic errors, unhandled failures, races,
               resources left open when a client disconnects.
            2. Security: access control (src/server/access.ts), git smart HTTP
               and SSH handling, auth, path handling, injection.
            3. Missing or weak tests for the changed behaviour.
            4. Conventions from CONTRIBUTING.md, for example a stale
               src/web/routeTree.gen.ts or a schema change without a migration.

            CI already runs the typecheck, unit tests, cargo fmt, clippy, and e2e
            tests, so don't report anything those would catch. Skip style nits
            and praise. Only report issues you are confident are real, and say
            how each one fails.

            This runs again on every push. Read the earlier review comments with
            `gh pr view --comments` and don't repeat an issue already raised
            unless the new commits changed it.

            Post each new issue as an inline comment on the relevant line with
            mcp__github_inline_comment__create_inline_comment. Then write one
            short summary with `gh pr comment --edit-last --create-if-none` so
            the PR keeps a single summary comment. If you found nothing, the
            summary says so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
